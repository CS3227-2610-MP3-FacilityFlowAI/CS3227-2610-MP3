<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report a problem · FacilityFlow AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/request-form.js}"></script>
</head>
<body>
<header th:replace="~{dashboard :: header}"></header>
<main>
    <h1>Report a problem</h1>
    <p>All fields are required. Your report will be submitted for facilities triage.</p>
    <p th:if="${message}" th:text="${message}" role="alert"></p>
    <p th:if="${!errors.isEmpty()}" role="alert">Check the marked fields and try again.</p>
    <p th:if="${errors.containsKey('submissionId')}" th:text="${errors['submissionId']}" role="alert"></p>
    <form method="post" th:action="@{/requester/requests}" data-request-form>
        <input type="hidden" name="submissionId" th:value="${submissionId}">
        <label for="title">Title (5–100 characters)</label>
        <input id="title" name="title" th:value="${form.title}" required
               th:attr="aria-invalid=${errors.containsKey('title')},aria-describedby=${errors.containsKey('title') ? 'title-error' : null}">
        <p id="title-error" class="error" th:if="${errors.containsKey('title')}" th:text="${errors['title']}"></p>
        <label for="description">Description (10–2,000 characters)</label>
        <textarea id="description" name="description" rows="7" th:text="${form.description}" required
                  th:attr="aria-invalid=${errors.containsKey('description')},aria-describedby=${errors.containsKey('description') ? 'description-error' : null}"></textarea>
        <p id="description-error" class="error" th:if="${errors.containsKey('description')}" th:text="${errors['description']}"></p>
        <label for="location">Location (2–120 characters)</label>
        <input id="location" name="location" th:value="${form.location}" required
               th:attr="aria-invalid=${errors.containsKey('location')},aria-describedby=${errors.containsKey('location') ? 'location-error' : null}">
        <p id="location-error" class="error" th:if="${errors.containsKey('location')}" th:text="${errors['location']}"></p>
        <label for="categoryId">Category</label>
        <select id="categoryId" name="categoryId" required
                th:attr="aria-invalid=${errors.containsKey('categoryId')},aria-describedby=${errors.containsKey('categoryId') ? 'category-error' : null}">
            <option value="">Choose a category</option>
            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
                    th:selected="${category.id.toString() == form.categoryId}"></option>
            <option th:if="${!form.categoryId.isEmpty() and !categories.![id.toString()].contains(form.categoryId)}"
                    th:value="${form.categoryId}" selected>Previous selection unavailable — choose an active category</option>
        </select>
        <p id="category-error" class="error" th:if="${errors.containsKey('categoryId')}" th:text="${errors['categoryId']}"></p>
        <label for="reportedUrgency">Reported urgency</label>
        <select id="reportedUrgency" name="reportedUrgency" required
                th:attr="aria-invalid=${errors.containsKey('reportedUrgency')},aria-describedby=${errors.containsKey('reportedUrgency') ? 'urgency-error' : null}">
            <option th:each="urgency : ${ {'LOW','NORMAL','HIGH','EMERGENCY'} }" th:value="${urgency}"
                    th:text="${urgency}" th:selected="${form.reportedUrgency == urgency}"></option>
        </select>
        <p id="urgency-error" class="error" th:if="${errors.containsKey('reportedUrgency')}" th:text="${errors['reportedUrgency']}"></p>
        <button type="submit">Submit request</button>
        <p data-submitting hidden role="status">Submitting your request…</p>
    </form>
    <a th:href="@{/requester/requests}">Back to My requests</a>
</main>
</body>
</html>
