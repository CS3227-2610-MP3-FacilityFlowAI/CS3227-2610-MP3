<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${request.displayId} + ' · FacilityFlow AI'"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/authenticated-header :: header(${username}, ${displayName}, ${role})}"></header>
<main id="main-content">
    <h1><span th:text="${request.displayId}"></span> — <span th:text="${request.title}"></span></h1>
    <dl>
        <dt>Description</dt><dd class="free-text" th:text="${request.description}"></dd>
        <dt>Location</dt><dd class="free-text" th:text="${request.location}"></dd>
        <dt>Category</dt><dd th:text="${request.category}"></dd>
        <dt>Status</dt><dd th:text="${request.status}"></dd>
        <dt>Reported urgency</dt><dd th:text="${request.reportedUrgency}"></dd>
        <dt>Manager priority</dt><dd th:text="${request.managerPriority ?: 'Awaiting triage'}"></dd>
        <dt>Created</dt><dd th:text="${request.createdTime()}"></dd>
        <dt>Updated</dt><dd th:text="${request.updatedTime()}"></dd>
    </dl>
    <h2>Request history</h2>
    <p th:if="${request.history.isEmpty()}">No history is available.</p>
    <ol>
        <li th:each="entry : ${request.history}">
            <strong th:text="${entry.event}"></strong> · <span th:text="${entry.time()}"></span>
            <span th:if="${!entry.author.isEmpty()}" th:text="${entry.author}"></span>
            <p class="free-text" th:if="${!entry.note.isEmpty()}" th:text="${entry.note}"></p>
        </li>
    </ol>
    <nav aria-label="Request actions">
        <span th:if="${request.status == 'OPEN'}">
            <a th:href="@{/requester/requests/{id}/edit(id=${request.displayId})}">Edit request</a>
            <a th:href="@{/requester/requests/{id}/cancel(id=${request.displayId})}">Cancel request</a>
        </span>
        <a th:if="${request.status != 'CLOSED' and request.status != 'CANCELLED'}"
           th:href="@{/requester/requests/{id}/updates/new(id=${request.displayId})}">Add Requester Update</a>
    </nav>
    <a th:href="@{/requester/requests}">Back to My requests</a>
</main>
</body>
</html>
