<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/technician.css}">
    <title th:text="${title} + ' · FacilityFlow AI'">Change password · FacilityFlow AI</title>
</head>
<body>
<div th:replace="~{fragments/authenticated-header :: header(${username}, ${displayName}, ${role})}"></div>
<main id="main-content">
    <h1>Change password</h1>
    <p>Use 8–24 Unicode characters. Spaces are allowed.</p>
    <p th:if="${changed}" class="success" role="status">Your password was changed.</p>
    <p th:if="${passwordError}" class="error" role="alert" th:text="${passwordError}">Password change is temporarily unavailable.</p>
    <form method="post" th:action="@{/account/password}" data-pending-form>
        <label for="currentPassword">Current password <span>(required)</span></label>
        <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required
               th:attr="aria-invalid=${fieldErrors.containsKey('currentPassword')},aria-describedby=${fieldErrors.containsKey('currentPassword') ? 'currentPassword-error' : null}">
        <p id="currentPassword-error" th:if="${fieldErrors.containsKey('currentPassword')}" class="field-error" role="alert" th:text="${fieldErrors.currentPassword}">Enter your current password.</p>
        <label for="newPassword">New password <span>(required)</span></label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required
               th:attr="aria-invalid=${fieldErrors.containsKey('newPassword')},aria-describedby=${fieldErrors.containsKey('newPassword') ? 'newPassword-error' : null}">
        <p id="newPassword-error" th:if="${fieldErrors.containsKey('newPassword')}" class="field-error" role="alert" th:text="${fieldErrors.newPassword}">Use 8–24 Unicode characters.</p>
        <label for="confirmPassword">Confirm new password <span>(required)</span></label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required
               th:attr="aria-invalid=${fieldErrors.containsKey('confirmPassword')},aria-describedby=${fieldErrors.containsKey('confirmPassword') ? 'confirmPassword-error' : null}">
        <p id="confirmPassword-error" th:if="${fieldErrors.containsKey('confirmPassword')}" class="field-error" role="alert" th:text="${fieldErrors.confirmPassword}">Passwords must match.</p>
        <button type="submit">Change password</button>
    </form>
</main>
</body>
</html>
