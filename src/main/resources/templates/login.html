<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/technician.css}">
    <script defer th:src="@{/js/form-submission.js}"></script>
    <title>Sign in · FacilityFlow AI</title>
    <link rel="stylesheet" th:href="@{/css/workspace.css}">
</head>
<body class="login-page">
<main id="main-content">
    <h1>FacilityFlow AI</h1>
    <p>Sign in to your maintenance workspace.</p>
    <p role="alert" th:if="${error}" th:text="${error}">Invalid username or password</p>
    <p role="status" th:if="${loggedOut}">You have signed out.</p>
    <form method="post" th:action="@{/login}" data-pending-form>
        <div>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
