<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Categories · FacilityFlow AI</title><link rel="stylesheet" th:href="@{/css/manager.css}">    <link rel="stylesheet" th:href="@{/css/workspace.css}">
</head>
<body><header class="site-header"><div class="identity"><strong th:text="${displayName}">Manager</strong><span th:text="${username}">username</span></div><nav aria-label="Manager navigation"><a th:href="@{/manager/overview}">Overview</a><a th:href="@{/manager/requests}">Requests</a><a th:href="@{/manager/accounts}">Accounts</a><a th:href="@{/manager/categories}">Categories</a><a th:href="@{/manager/skills}">Skills</a><a th:href="@{/manager/audit}">Audit</a></nav><form method="post" th:action="@{/logout}"><button class="button button-quiet" type="submit">Sign out</button></form></header>
<main class="page-shell"><div class="title-row"><div><h1>Category catalogue</h1><p class="request-reference">Maintain the categories used for reporting and triage.</p></div></div><div class="alert alert-success" role="status" th:if="${notice}" th:text="${notice}">Saved.</div><div class="alert alert-error" role="alert" th:unless="${#maps.isEmpty(errors)}"><strong>The change was not saved.</strong><p th:each="error : ${errors.values()}" th:text="${error}">Error</p></div>
<section class="settings-section"><h2>Create a category</h2><form class="inline-form" method="post" th:action="@{/manager/categories}"><div><label for="category-name">Category name</label><input id="category-name" name="name" type="text" minlength="2" maxlength="50" required th:value="${failedAction == 'create' ? form : ''}"></div><button class="button button-primary" type="submit">Create category</button></form></section>
<section class="settings-section"><h2>Catalogue</h2><div class="settings-list"><article class="settings-row" th:each="category : ${page.categories}"><div class="settings-summary"><div><strong th:text="${category.name}">Category</strong><span th:text="${category.requestCount + ' request(s)'}">0 requests</span></div><span class="status-chip" th:text="${category.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span></div><div class="settings-actions" th:if="${category.active}"><form method="post" th:action="@{/manager/categories/{id}/rename(id=${category.id})}"><input type="hidden" name="version" th:value="${category.version}"><label th:for="${'category-rename-' + category.id}">New name</label><input th:id="${'category-rename-' + category.id}" name="name" type="text" minlength="2" maxlength="50" required th:value="${failedAction == 'rename-' + category.id.toString() ? form.name : category.name}"><button class="button button-quiet" type="submit">Rename</button></form><form method="post" th:action="@{/manager/categories/{id}/remove(id=${category.id})}"><input type="hidden" name="version" th:value="${category.version}"><label th:for="${'replacement-' + category.id}">Replacement category</label><select th:id="${'replacement-' + category.id}" name="replacementId" required><option value="">Choose a replacement</option><option th:each="option : ${page.activeCategories}" th:if="${option.id != category.id}" th:value="${option.id}" th:text="${option.label}" th:selected="${failedAction == 'remove-' + category.id.toString() and form.replacementId == option.id.toString()}"></option></select><label class="check-row"><input type="checkbox" name="confirmed" value="true" required><span>Confirm removal and Request migration</span></label><button class="button button-danger" type="submit">Remove and migrate</button></form></div></article></div></section></main></body></html>
