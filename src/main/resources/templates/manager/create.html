<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Record request · FacilityFlow AI</title><script defer th:src="@{/js/pending-submit.js}"></script></head>
<body>
<header><a th:href="@{/manager}">Manager workspace</a> · <a th:href="@{/manager/requests}">All requests</a> · <a th:href="@{/manager/accounts}">Accounts</a> · <a th:href="@{/manager/categories}">Categories</a> · <a th:href="@{/manager/skills}">Skills</a></header>
<main>
    <h1>Record a request on behalf</h1>
    <p>Only active Requester accounts are available. The Requester becomes the owner; your Manager account is recorded as the actor.</p>
    <p role="alert" th:if="${errors.save}" th:text="${errors.save}"></p>
    <form method="post" th:action="@{/manager/requests}" data-prevent-double-submit>
        <div><label for="requesterId">Requester <span aria-hidden="true">*</span></label><select id="requesterId" name="requesterId" required aria-required="true"><option value="">Choose a Requester</option><option th:each="option : ${options.requesters}" th:value="${option.id}" th:text="${option.label}" th:selected="${draft.requesterId == option.id.toString()}"></option><option th:if="${!draft.requesterId.isEmpty() and !options.requesters.![id.toString()].contains(draft.requesterId)}" th:value="${draft.requesterId}" selected>Previous Requester selection temporarily unavailable</option></select><p role="alert" th:if="${errors.requesterId}" th:text="${errors.requesterId}"></p></div>
        <div><label for="title">Title <span aria-hidden="true">*</span></label><input id="title" name="title" required minlength="5" maxlength="100" th:value="${draft.title}"><p role="alert" th:if="${errors.title}" th:text="${errors.title}"></p></div>
        <div><label for="description">Description <span aria-hidden="true">*</span></label><textarea id="description" name="description" required minlength="10" maxlength="2000" th:text="${draft.description}"></textarea><p role="alert" th:if="${errors.description}" th:text="${errors.description}"></p></div>
        <div><label for="location">Location <span aria-hidden="true">*</span></label><input id="location" name="location" required minlength="2" maxlength="120" th:value="${draft.location}"><p role="alert" th:if="${errors.location}" th:text="${errors.location}"></p></div>
        <div><label for="categoryId">Category <span aria-hidden="true">*</span></label><select id="categoryId" name="categoryId" required aria-required="true"><option value="">Choose a category</option><option th:each="option : ${options.categories}" th:value="${option.id}" th:text="${option.label}" th:selected="${draft.categoryId == option.id.toString()}"></option><option th:if="${!draft.categoryId.isEmpty() and !options.categories.![id.toString()].contains(draft.categoryId)}" th:value="${draft.categoryId}" selected>Previous category selection temporarily unavailable</option></select><p role="alert" th:if="${errors.categoryId}" th:text="${errors.categoryId}"></p></div>
        <div><label for="reportedUrgency">Reported urgency <span aria-hidden="true">*</span></label><select id="reportedUrgency" name="reportedUrgency" required><option th:each="value : ${ {'LOW','NORMAL','HIGH','EMERGENCY'} }" th:value="${value}" th:text="${value}" th:selected="${draft.reportedUrgency == value}"></option></select><p role="alert" th:if="${errors.reportedUrgency}" th:text="${errors.reportedUrgency}"></p></div>
        <button type="submit">Record request</button>
    </form>
</main>
</body>
</html>
