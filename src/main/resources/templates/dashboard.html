<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/technician.css}">
    <title th:text="${title} + ' · FacilityFlow AI'">FacilityFlow AI</title>
    <link rel="stylesheet" th:href="@{/css/workspace.css}">
</head>
<body>
<div th:replace="~{fragments/authenticated-header :: header(${username}, ${displayName}, ${role})}"></div>
<main id="main-content">
    <h1 th:text="${title}">Workspace</h1>
    <p>The authenticated foundation is ready for this role's workflow.</p>
    <nav th:if="${role == 'FACILITIES_MANAGER'}" aria-label="Facilities Manager features">
        <ul>
            <li><a th:href="@{/manager/overview}">Operational overview</a></li>
            <li><a th:href="@{/manager/requests}">All requests</a></li>
            <li><a th:href="@{/manager/requests/new}">Record a request on behalf</a></li>
            <li><a th:href="@{/manager/audit}">Audit viewer</a></li>
        </ul>
    </nav>
</main>
</body>
</html>
