<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password · FacilityFlow AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{dashboard :: header}"></header>
<main>
    <h1>Change password</h1>
    <p th:if="${param.changed}" role="status">Password changed. You remain signed in.</p>
    <p id="password-error" th:if="${error}" th:text="${error}" role="alert"></p>
    <form method="post" th:action="@{/account/password}">
        <p><label for="currentPassword">Current password (required)</label>
            <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password"
                   required th:attr="aria-describedby=${error != null ? 'password-error' : null}"></p>
        <p><label for="newPassword">New password (required, 8–24 characters)</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password"
                   required th:attr="aria-describedby=${error != null ? 'password-error' : null}"></p>
        <button type="submit">Change password</button>
    </form>
    <a th:href="${workspace}">Back to main workspace</a>
</main>
</body>
</html>
