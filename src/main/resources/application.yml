spring:
  application:
    name: facilityflow-ai
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 10000
      data-source-properties:
        sslmode: verify-full
        sslrootcert: ${SUPABASE_SSL_ROOT_CERT}
        connectTimeout: 10
        socketTimeout: 30
  sql:
    init:
      mode: never
  flyway:
    # Runtime verifies schema versions read-only; only the explicit migration profile performs DDL.
    enabled: false
    schemas: facilityflow
    default-schema: facilityflow
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    ignore-migration-patterns: ''
  session:
    timeout: -1s
    jdbc:
      initialize-schema: never
      table-name: facilityflow.spring_session
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
facilityflow:
  ai:
    # Bind as strings so malformed deployment values make AI unavailable without
    # preventing the manual FacilityFlow application from starting.
    enabled: "${AI_ENABLED:false}"
    base-url: "${SOCLAAS_BASE_URL:https://soclaas-api.comp.nus.edu.sg/v1}"
    api-key: "${SOCLAAS_API_KEY:}"
    model: "${SOCLAAS_MODEL:}"
    timeout-seconds: "${AI_TIMEOUT_SECONDS:30}"
    max-output-tokens: "${AI_MAX_OUTPUT_TOKENS:800}"
    max-in-flight: "${AI_MAX_IN_FLIGHT:5}"
    rate-per-minute: "${AI_RATE_PER_MINUTE:5}"
    rate-per-hour: "${AI_RATE_PER_HOUR:30}"
  security:
    password:
      salt-length: 16
      hash-length: 32
      parallelism: 1
      memory-kib: 65536
      iterations: 3
