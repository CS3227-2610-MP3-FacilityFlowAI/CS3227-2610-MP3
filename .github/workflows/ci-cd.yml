name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 64.5.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  GRYPE_VERSION: 0.120.1
  GRYPE_LINUX_X64_SHA256: 0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d

jobs:
  operations-backup-rehearsal:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/production-backup.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write

  operations-alert-rehearsal:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/production-monitor.yml
    with:
      exercise: true
    permissions:
      contents: read
      issues: write

  verify:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Check changed-file whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Run checks and build executable JAR
        run: ./gradlew clean check bootJar --no-daemon

      - name: Run dependency-free JavaScript checks when present
        shell: bash
        run: |
          while IFS= read -r test_file; do
            node "$test_file"
          done < <(find src/test/js -type f -name '*.test.cjs' -print 2>/dev/null | sort)

      - name: Verify deployment gates and smoke authentication
        run: |
          node .github/scripts/deployment-gates.test.cjs
          bash .github/scripts/smoke-test.test.sh

      - name: Verify operations monitoring
        run: |
          python3 -m unittest discover -s .github/scripts -p '*_test.py'
          bash -n .github/scripts/production-backup.sh

      - name: Install checksum-verified Grype
        shell: bash
        run: |
          archive="$RUNNER_TEMP/grype.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${GRYPE_LINUX_X64_SHA256}  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" grype

      - name: Scan packaged dependencies
        run: |
          "$RUNNER_TEMP/grype" build/libs --fail-on high --only-fixed

      - name: Upload application and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: facilityflow-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/reports/jacoco/

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks

      - name: Scan committed history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  container:
    name: Build deployment container
    needs:
      - verify
      - secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Confirm local and Vercel images are identical
        run: cmp Dockerfile Dockerfile.vercel

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Vercel container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.vercel
          push: false
          tags: facilityflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  preview:
    name: Deploy Preview and smoke test
    needs:
      - verify
      - secret-scan
      - container
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Link Preview environment
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify Preview source upload
        run: >-
          npx --yes vercel@${VERCEL_CLI_VERSION} deploy --dry --json --token="$VERCEL_TOKEN"
          | node .github/scripts/check-vercel-inputs.cjs

      - name: Deploy Preview container
        id: deploy
        shell: bash
        run: |
          deployment_url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --yes \
            --token="$VERCEL_TOKEN" --env APP_VERSION="$GITHUB_SHA")"
          if [[ ! "$deployment_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo "Vercel did not return a valid deployment URL." >&2
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke test Preview
        env:
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_BYPASS_SECRET: ${{ secrets.SMOKE_BYPASS_SECRET }}
        run: .github/scripts/smoke-test.sh "${{ steps.deploy.outputs.url }}"

      - name: Record Preview evidence
        run: |
          echo "### Preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke: health, login and authenticated safe read passed" >> "$GITHUB_STEP_SUMMARY"

  production-candidate:
    name: Stage Production candidate
    needs:
      - verify
      - secret-scan
      - container
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.VERCEL_DEPLOY_ENABLED == 'true' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production-candidate
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Validate Production smoke credentials
        env:
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [[ -z "$SMOKE_USERNAME" || -z "$SMOKE_PASSWORD" ]]; then
            echo "Configure production-candidate environment SMOKE_USERNAME and SMOKE_PASSWORD before enabling Production deployment." >&2
            exit 1
          fi

      - name: Link Production environment
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify Production source upload
        run: >-
          npx --yes vercel@${VERCEL_CLI_VERSION} deploy --dry --json --prod --token="$VERCEL_TOKEN"
          | node .github/scripts/check-vercel-inputs.cjs

      - name: Deploy staged Production candidate
        id: deploy
        shell: bash
        run: |
          deployment_url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --yes --prod --skip-domain \
            --token="$VERCEL_TOKEN" --env APP_VERSION="$GITHUB_SHA")"
          if [[ ! "$deployment_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo "Vercel did not return a valid deployment URL." >&2
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke test staged candidate
        env:
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_BYPASS_SECRET: ${{ secrets.SMOKE_BYPASS_SECRET }}
        run: .github/scripts/smoke-test.sh "${{ steps.deploy.outputs.url }}"

      - name: Record candidate evidence
        run: |
          echo "### Staged Production candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke: health, login and authenticated safe read passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Domain assignment: intentionally skipped" >> "$GITHUB_STEP_SUMMARY"

  promote-production:
    name: Human-approved Production promotion
    concurrency:
      group: production-promotion
      cancel-in-progress: false
    needs:
      - production-candidate
    if: >-
      needs.production-candidate.result == 'success' &&
      vars.PRODUCTION_PROMOTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ needs.production-candidate.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Promote the tested deployment without rebuilding
        run: >-
          npx --yes vercel@${VERCEL_CLI_VERSION} promote
          "${{ needs.production-candidate.outputs.url }}"
          --yes --token="$VERCEL_TOKEN"

      - name: Record promotion evidence
        run: |
          echo "### Production promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Promoted deployment: ${{ needs.production-candidate.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rebuild: none" >> "$GITHUB_STEP_SUMMARY"
