name: PR Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

  issue_comment:
    types:
      - created
      - edited

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}

    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      contents: read

    name: Run PR Agent

    steps:
      - name: PR Agent
        uses: the-pr-agent/pr-agent@33d3e267c910d196689b6770c3e36f3ece0bd00f # main on 2026-10-18
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
