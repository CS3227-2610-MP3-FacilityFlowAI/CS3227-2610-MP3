name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Java verification and package application
        run: ./gradlew clean check bootJar --no-daemon

      - name: Run dependency-free JavaScript checks when present
        shell: bash
        run: |
          while IFS= read -r test_file; do
            node "$test_file"
          done < <(find src/test/js -type f -name '*.test.cjs' -print 2>/dev/null | sort)

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload bootable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: facilityflow-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
