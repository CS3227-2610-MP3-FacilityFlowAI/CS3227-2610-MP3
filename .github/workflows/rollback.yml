name: Roll back Production

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Previous known-good Vercel Production deployment URL
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK to request the protected rollback job
        required: true
        type: string

concurrency:
  group: production-promotion
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 64.5.0

jobs:
  rollback:
    name: Human-approved rollback
    if: inputs.confirmation == 'ROLLBACK'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ inputs.deployment_url }}
    env:
      DEPLOYMENT_URL: ${{ inputs.deployment_url }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate target URL
        shell: bash
        run: |
          if [[ ! "$DEPLOYMENT_URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo "Enter a Vercel deployment URL." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Roll back to the known-good deployment
        run: >-
          npx --yes vercel@${VERCEL_CLI_VERSION} rollback
          "$DEPLOYMENT_URL"
          --non-interactive --token="$VERCEL_TOKEN"

      - name: Record rollback evidence
        run: |
          echo "### Production rollback" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Target: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Requested by: \`$GITHUB_ACTOR\`" >> "$GITHUB_STEP_SUMMARY"
